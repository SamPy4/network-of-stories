services:
  backend:
    build: ./backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/
      - ./backend/mock_data:/app/mock_data/
      - ./backend/embeddings:/app/embeddings/
      - ./backend/embeddings/embedding_model:/app/embeddings/embedding_model/
      - ./backend/clusterings:/app/clusterings/

  db:
      image: pgvector/pgvector:pg16
      restart: always
      environment:
        POSTGRES_DB: mydatabase
        POSTGRES_USER: myuser
        POSTGRES_PASSWORD: mypassword
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./db_data:/root/


  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:

